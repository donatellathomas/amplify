<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Keys.glb — angled PNG export</title>
    <script
      type="module"
      src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"
    ></script>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #121212;
        color: #ededed;
        font-family: system-ui, sans-serif;
      }
      .hint {
        max-width: 44rem;
        padding: 0 16px;
        font-size: 14px;
        line-height: 1.5;
        text-align: center;
      }
      model-viewer#mv {
        width: 1920px;
        height: 1080px;
        max-width: none;
        background: #121212;
      }
      button {
        padding: 10px 18px;
        font-size: 15px;
        cursor: pointer;
        border-radius: 8px;
        border: 1px solid #444;
        background: #1e1e1e;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <p class="hint">
      Roll π about Z aligns the mesh, then orbit θ ~118° / φ ~73° for a light three-quarter
      view of the keybed (gallery framing aimed at the back shell by default).
    </p>
    <model-viewer
      id="mv"
      src="./assets/Keys.glb"
      alt=""
      min-camera-orbit="-Infinity 75deg 70%"
      max-camera-orbit="Infinity 75deg 140%"
      shadow-intensity="0.2"
      exposure="1.2"
      environment-image="./assets/keys-reflection-env.png"
      tone-mapping="commerce"
      interaction-prompt="none"
    ></model-viewer>
    <button type="button" id="download">Download PNG</button>
    <script type="module">
      const mv = document.getElementById("mv");
      const btn = document.getElementById("download");
      const OUT = "Keys-front-horizontal.png";

      await customElements.whenDefined("model-viewer");
      await mv.loaded;
      /* Face keybed toward camera vs default framing */
      mv.orientation = "0deg 0deg 180deg";
      mv.cameraOrbit = "118deg 73deg auto";
      await mv.updateComplete;
      if (typeof mv.jumpCameraToGoal === "function") {
        mv.jumpCameraToGoal();
        await mv.updateComplete;
      }

      async function downloadPng() {
        await mv.loaded;
        await mv.updateComplete;
        await new Promise((r) =>
          requestAnimationFrame(() => requestAnimationFrame(r))
        );
        const blob = await mv.toBlob({
          mimeType: "image/png",
          idealAspect: false,
        });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = OUT;
        a.click();
        URL.revokeObjectURL(url);
      }

      btn.addEventListener("click", () => {
        downloadPng().catch(console.error);
      });
    </script>
  </body>
</html>
