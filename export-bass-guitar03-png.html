<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BassGuitar03 — PNG export (reflection)</title>
    <script
      type="module"
      src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"
    ></script>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #121212;
        color: #ededed;
        font-family: system-ui, sans-serif;
      }
      .hint {
        max-width: 40rem;
        padding: 0 16px;
        font-size: 14px;
        line-height: 1.5;
        text-align: center;
      }
      code {
        font-size: 13px;
      }
      model-viewer#mv {
        width: min(1024px, 96vw);
        height: min(1024px, 96vw);
        background: #121212;
      }
      button {
        padding: 10px 18px;
        font-size: 15px;
        cursor: pointer;
        border-radius: 8px;
        border: 1px solid #444;
        background: #1e1e1e;
        color: #fff;
      }
      button:hover {
        border-color: #00f0ff;
      }
    </style>
  </head>
  <body>
    <p class="hint">
      Serve this repo from its root (so asset paths work), e.g.
      <code>python3 -m http.server 8765</code> then open
      <code>http://localhost:8765/export-bass-guitar03-png.html</code>
      and click Download PNG.
    </p>
    <model-viewer
      id="mv"
      src="./assets/BassGuitar03.glb"
      alt=""
      orientation="0deg 90deg 0deg"
      camera-orbit="0deg 75deg auto"
      min-camera-orbit="-Infinity 75deg 70%"
      max-camera-orbit="Infinity 75deg 140%"
      shadow-intensity="0.22"
      exposure="1.15"
      environment-image="./assets/bass-reflection-env.png"
      tone-mapping="commerce"
      interaction-prompt="none"
    ></model-viewer>
    <button type="button" id="download">Download PNG</button>
    <script type="module">
      const mv = document.getElementById("mv");
      const btn = document.getElementById("download");

      async function downloadPng() {
        await customElements.whenDefined("model-viewer");
        await mv.loaded;
        await mv.updateComplete;
        await new Promise((r) =>
          requestAnimationFrame(() => requestAnimationFrame(r))
        );
        const blob = await mv.toBlob({
          mimeType: "image/png",
          idealAspect: false,
        });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "BassGuitar03-reflection.png";
        a.click();
        URL.revokeObjectURL(url);
      }

      btn.addEventListener("click", () => {
        downloadPng().catch((err) => {
          console.error(err);
          alert("Export failed — check the console. Use a local server, not file://.");
        });
      });
    </script>
  </body>
</html>
